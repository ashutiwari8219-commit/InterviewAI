{% extends "base.html" %}
{% block title %}Choose a role · InterviewAI{% endblock %}
{% block content %}
<h2>Choose a role</h2>
<form method="post" class="grid">
  {% for r in roles %}
  <button class="card pick" name="role" value="{{ r }}"><strong>{{ r }}</strong><span class="muted">4 questions</span></button>
  {% endfor %}
</form>
{% endblock %}
