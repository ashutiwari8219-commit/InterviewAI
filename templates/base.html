<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}InterviewAI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <a class="brand" href="{{ url_for('home') }}">InterviewAI</a>
  <nav>
  {% if session.user_id %}
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('start_interview') }}">Practice</a>
    <a href="{{ url_for('performance') }}">Performance</a>
    <a href="{{ url_for('profile') }}">Profile</a>
    <a href="{{ url_for('logout') }}">Log out</a>
  {% else %}
    <a href="{{ url_for('login') }}">Log in</a>
    <a class="btn small" href="{{ url_for('register') }}">Sign up</a>
  {% endif %}
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
